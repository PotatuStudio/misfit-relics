plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Maven de Modrinth, solo para mods (grupo maven.modrinth).
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	// Trinkets Updated (espacios de accesorios).
	exclusiveContent {
		forRepository {
			maven {
				name = "Nucleoid"
				url = "https://maven.nucleoid.xyz/releases"
			}
		}
		filter {
			includeGroup "eu.pb4"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"misfitrelics" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Trinkets Updated: espacios de accesorios (collar del murciélago).
	implementation "eu.pb4:trinkets:${project.trinkets_version}"

	// Solo para desarrollo (runClient): no se publican ni van dentro del jar.
	localRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
	localRuntime "maven.modrinth:placeholder-api:${project.placeholder_api_version}"
	// JEI para buscar ítems por mod (@misfitrelics). IDs de versión de Modrinth (mismo número para cada loader).
	// Se compila contra JEI solo para la página "dónde encontrarlo" (integración opcional, no es dependencia).
	compileOnly "maven.modrinth:jei:${project.jei_version_id}"
	localRuntime "maven.modrinth:jei:${project.jei_version_id}"
	localRuntime "maven.modrinth:mezzconfig:${project.mezzconfig_version_id}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	// El español se traduce una sola vez (es_es) y se copia a las demás variantes: Minecraft no cae de
	// es_cl a es_es, sino directo a inglés.
	["es_ar", "es_cl", "es_ec", "es_mx", "es_uy", "es_ve"].each { locale ->
		from("src/main/resources/assets/misfitrelics/lang/es_es.json") {
			into "assets/misfitrelics/lang"
			rename { "${locale}.json" }
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
